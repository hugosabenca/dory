<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dory</title>
  <meta name="description" content="Pendências da casa e lista de compras compartilhadas">
  <meta name="theme-color" content="#0F6E66">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Cada "camada" abaixo é preenchida pelo app.js -->
  <main id="tela"></main>          <!-- tela principal (listas) -->
  <div id="sobreposicao"></div>    <!-- páginas por cima: formulário, configurações, modo compras -->
  <div id="folha"></div>           <!-- janelas que sobem de baixo -->
  <div id="aviso"></div>           <!-- aviso com "Desfazer" -->
  <div id="visor"></div>           <!-- foto em tela cheia -->
  <div id="ouvindo"></div>         <!-- microfone ouvindo -->
  <noscript>O Dory precisa do JavaScript ligado no navegador.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
